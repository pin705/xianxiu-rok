name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run sim # bot phải tới Chủ điện tầng 15 trong 30 ngày, không thì báo lỗi
      - run: npm run build
      - run: npm run e2e # Chrome có sẵn trên máy ảo ubuntu: chơi thật 14 nhiệm vụ, 2 tab, offline
        env:
          CHROME: /usr/bin/google-chrome
