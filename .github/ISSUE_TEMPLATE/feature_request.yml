name: Đề xuất tính năng
description: Ý tưởng mới hay cải thiện cái có sẵn
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: Trước khi gửi, đọc [docs/PLAN.md](https://github.com/pin705/rok/blob/master/docs/PLAN.md) — ý tưởng có thể đã nằm trong lộ trình.
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề cần giải
      description: Người chơi gặp khó gì / thiếu trải nghiệm gì? Kể theo góc nhìn người chơi.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Giải pháp đề xuất
      description: Cứ đề xuất cụ thể — cơ chế chơi, màn hình, nhịp thời gian…
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Cách khác đã cân nhắc
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Bối cảnh thêm
      description: So sánh với game cùng thể loại, ảnh mô phỏng, liên quan hệ thống nào trong PLAN/UX.
    validations:
      required: false
